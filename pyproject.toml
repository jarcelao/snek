[project]
name = "battlesnake"
version = "0.1.0"
description = "A local Battlesnake simulation environment and snake policy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "neat-python>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
